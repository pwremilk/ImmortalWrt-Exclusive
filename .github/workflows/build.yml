name: Build ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt tag (empty = auto latest v25.12.x)"
        required: false
        default: ""
      force:
        description: "Force rebuild even if release exists"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 18 * * *"   # 02:00 北京时间，每天检查上游新版本

# 没有这段 permissions 时 GITHUB_TOKEN 默认只读，Publish release 会 403 Resource not accessible by integration
permissions:
  contents: write

env:
  REPO: immortalwrt/immortalwrt
  VERSION_SERIES: "v25\\.12\\."

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Resolve latest stable tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            for i in 1 2 3; do
              TAG=$(curl -s --retry 2 "https://api.github.com/repos/${REPO}/tags?per_page=100" \
                | grep -oE '"name": "v[0-9]+\.[0-9]+\.[0-9]+"' | sort -Vr | head -1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+') && [ -n "$TAG" ] && break
              sleep 10
            done
          fi
          TAG="${TAG:-v25.12.2}"
          echo "resolved tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "IMM_TAG=$TAG" >> $GITHUB_ENV
          if [ "${{ inputs.force }}" != "true" ]; then
            # skip 检查带重试；API 限流/EOF/超时一律兜底按"已存在"处理，避免误触发全量重建
            determined=false
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.github.com/repos/${{ github.repository }}/releases/tags/ImmortalWrt-$TAG")
              if [ "$code" = "200" ]; then
                echo "release ImmortalWrt-$TAG already exists, skip"
                echo "skip=true" >> $GITHUB_OUTPUT
                determined=true
                break
              elif [ "$code" = "404" ]; then
                echo "release ImmortalWrt-$TAG does not exist, will build"
                determined=true
                break
              else
                echo "API check returned $code (rate-limit/EOF?), retry $i"
                sleep 8
              fi
            done
            if [ "$determined" != "true" ]; then
              # 三次都拿不到明确结果：视为已存在，跳过，避免白烧一次 2h 编译
              echo "release existence undetermined after retries, skipping to be safe"
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Skip notice
        if: steps.tag.outputs.skip == 'true'
        run: echo "Up to date. Add --field inputs.force=true to rebuild manually."

      - name: Install build dependencies
        if: steps.tag.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            libncurses-dev libssl-dev libelf-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget antlr3-gettext-macro-timezone-measure 2>/dev/null || \
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            libncurses-dev libssl-dev libelf-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget antlr3 gettext libtool-bin

      - name: Clone ImmortalWrt
        if: steps.tag.outputs.skip != 'true'
        run: |
          git clone -b "$IMM_TAG" --depth 1 "https://github.com/${REPO}.git" openwrt

      - name: Apply customization
        if: steps.tag.outputs.skip != 'true'
        run: |
          cp -a files/. openwrt/files/ 2>/dev/null || { mkdir -p openwrt/files && cp -a files/. openwrt/files/; }
          # 第三方源置顶：feeds 安装先到先得，保证 sbwml/passwall 版本压过官方同名包
          # passwall_packages(依赖库)排尾部：官方 xray-core(26.3)兼容 golang1.26，passwall 源的 26.10 需要 go1.27 编不动
          grep -v 'src-git apkg' openwrt/feeds.conf.default > openwrt/fc.tmp
          cat feeds.conf.extra openwrt/fc.tmp feeds.conf.tail > openwrt/feeds.conf.default
          rm openwrt/fc.tmp
          cp config/imm.config openwrt/dotconfig.seed
          cp scripts/diy2.sh openwrt/diy2.sh
          chmod +x openwrt/diy2.sh

      - name: Update feeds
        if: steps.tag.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          # 索引体检：任何 feed 元数据为空都立即止损
          for idx in feeds/*.index; do
            [ -s "$idx" ] || { echo "FATAL: 空索引 $idx（扫描静默失败）"; exit 1; }
          done
          echo "indexes OK"

      - name: Bump rust to latest (ci-llvm survival)
        if: steps.tag.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          # rust-lang 会定期清掉旧版 stable 的 ci-artifacts（1.96.0 的 rust-dev 已 NoSuchKey），
          # 而 rust 引导默认 download-ci-llvm=true 必须下到那个产物。快照钉的 rust 版本若被清就必挂。
          # 方案：构建时把 rust 包升到 immortalwrt/packages master 最新版（产物通常都在），保 shadowsocks-rust 等。
          RF="feeds/packages/lang/rust/Makefile"
          [ -f "$RF" ] || { echo "FATAL: rust Makefile 不存在 $RF"; exit 1; }
          MASTER=$(curl -sf "https://raw.githubusercontent.com/immortalwrt/packages/master/lang/rust/Makefile") || { echo "FATAL: 拉取 master rust Makefile 失败"; exit 1; }
          NEWVER=$(echo "$MASTER" | grep -oE '^PKG_VERSION:=[0-9.]+' | cut -d= -f2)
          NEWHASH=$(echo "$MASTER" | grep -oE '^PKG_HASH:=[0-9a-f]{64}' | cut -d= -f2)
          [ -n "$NEWVER" ] && [ -n "$NEWHASH" ] || { echo "FATAL: master rust 版本/哈希解析失败 ($NEWVER/$NEWHASH)"; exit 1; }
          OLDVER=$(grep -oE '^PKG_VERSION:=[0-9.]+' "$RF" | cut -d= -f2)
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$NEWVER/" "$RF"
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=$NEWHASH/" "$RF"
          echo "rust bumped $OLDVER -> $NEWVER"
          # 校验该版本的 ci-llvm 产物真的活着（防上游又清新版本）
          CH=$(curl -sf "https://static.rust-lang.org/dist/channel-rust-${NEWVER}.toml" | grep -oE 'git_commit_hash = "[0-9a-f]{40}"' | head -1 | grep -oE '[0-9a-f]{40}')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://ci-artifacts.rust-lang.org/rustc-builds/${CH}/rust-dev-${NEWVER}-x86_64-unknown-linux-gnu.tar.xz")
          [ "$CODE" = "200" ] || { echo "FATAL: rust $NEWVER ci-llvm 产物也不可用(HTTP $CODE)，构建必挂"; exit 1; }
          echo "rust-gate PASS: $NEWVER ci-llvm HTTP $CODE"

      - name: Configure
        if: steps.tag.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          cp dotconfig.seed .config
          ./scripts/feeds install -a
          bash diy2.sh
          make defconfig
          echo "==== sanity ===="
          grep -E "^CONFIG_TARGET_ROOTFS_PARTSIZE=|nikki=|mosdns=|passwall=|argon=|KERNEL" .config | head -12
          # 硬闸门：符号必须"已定义+选中"双确认（未知符号在 .config 里会假存活）
          for p in luci luci-app-nikki mihomo-meta luci-app-mosdns mosdns luci-app-passwall luci-theme-argon luci-app-upnp; do
            grep -qE "^[[:space:]]*config PACKAGE_${p}\$" tmp/.config-package.in || { echo "FATAL: $p 未被构建系统识别（源未装好）"; exit 1; }
            grep -q "^CONFIG_PACKAGE_${p}=y$" .config || {
              echo "FATAL: $p 未选中，依赖情况："
              awk "/^[[:space:]]*config PACKAGE_${p}\$/,/^$/" tmp/.config-package.in | head -8
              exit 1; }
          done
          grep -q "^CONFIG_TARGET_ROOTFS_PARTSIZE=976$" .config || { echo "FATAL: PARTSIZE 丢失"; exit 1; }
          # 出处断言：关键包必须来自第三方源，且官方同名副本不得同时在链
          [ -e package/feeds/mosdns/mosdns ] && [ ! -e package/feeds/packages/mosdns ] || { echo "FATAL: mosdns 出处不对(sbwml未胜出或官方重复在链)"; ls package/feeds/*/mosdns 2>/dev/null; exit 1; }
          [ -e package/feeds/passwall_luci/luci-app-passwall ] && [ ! -e package/feeds/luci/luci-app-passwall ] || { echo "FATAL: passwall 出处不对"; ls package/feeds/*/luci-app-passwall 2>/dev/null; exit 1; }
          [ -e package/feeds/nikki/mihomo-meta ] || { echo "FATAL: mihomo-meta 未从 nikki 源安装"; exit 1; }
          [ -e package/feeds/packages/xray-core ] && [ ! -e package/feeds/passwall_packages/xray-core ] || { echo "FATAL: xray-core 未走官方源(go版本兼容)"; ls package/feeds/*/xray-core 2>/dev/null; exit 1; }
          echo "sanity PASS"

      - name: Download packages
        if: steps.tag.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          (make -j$(nproc) download V=w 2>&1 | tail -5) || true
          make download V=w -j1 2>&1 | tail -3 || true

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          make -j$(($(nproc)-1)) V=s > /tmp/build.log 2>&1 || {
            echo "==== parallel build failed, retry serial ===="
            make -j1 V=s > /tmp/build2.log 2>&1 || {
              echo "==== tail of logs ===="; tail -50 /tmp/build.log; tail -50 /tmp/build2.log; exit 1; }
          }
          find bin/targets -name "immortalwrt*x86-64*combined-efi*sysupgrade*" | tee /tmp/artifacts.txt

      - name: Upload artifact (backup)
        if: steps.tag.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ steps.tag.outputs.tag }}
          path: openwrt/bin/targets/*/*/*.img.gz
          retention-days: 90
          if-no-files-found: error

      - name: Publish release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmortalWrt-${{ steps.tag.outputs.tag }}
          name: "ImmortalWrt ${{ steps.tag.outputs.tag }} (定制固件)"
          files: openwrt/bin/targets/*/*/*.img.gz
          overwrite_files: true
          body: |
            基于 ImmortalWrt ${{ steps.tag.outputs.tag }}。
            旁路由固件。管理地址 http://192.168.1.2 ，登录 root / password。
            BIOS 虚拟机刷 generic-ext4-combined.img.gz，UEFI 刷 -efi 版。
            提供 master 快照版 Release 可选，偏好尝鲜可自由选择。

      - name: NanoMuse TG push
        if: always() && steps.tag.outputs.skip != 'true' && env.NANOMUSE_TG_TOKEN != ''
        env:
          NANOMUSE_TG_TOKEN: ${{ secrets.NANOMUSE_TG_TOKEN }}
          NANOMUSE_CHAT: ${{ secrets.NANOMUSE_CHAT }}
          FW_TAG: ${{ steps.tag.outputs.tag }}
          BUILD_CONCLUSION: ${{ job.status }}
        run: python3 scripts/notify.py
