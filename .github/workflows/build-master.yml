name: Build ImmortalWrt master (snapshot)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if today's release exists"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "30 18 * * *"   # 02:30 北京时间（稳定版任务后半小时）

# 没有这段 permissions 时 GITHUB_TOKEN 默认只读，Publish release 会 403 Resource not accessible by integration
permissions:
  contents: write

env:
  REPO: immortalwrt/immortalwrt

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Resolve snapshot tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="master-$(TZ=Asia/Shanghai date +%Y%m%d)"
          echo "resolved tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "IMM_TAG=master" >> $GITHUB_ENV
          if [ "${{ inputs.force }}" != "true" ]; then
            if curl -sf "https://api.github.com/repos/${{ github.repository }}/releases/tags/ImmortalWrt-$TAG" | grep -q '"tag_name"'; then
              echo "release ImmortalWrt-$TAG already exists, skip"
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Skip notice
        if: steps.tag.outputs.skip == 'true'
        run: echo "Today's master build already published."

      - name: Install build dependencies
        if: steps.tag.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            libncurses-dev libssl-dev libelf-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget antlr3-gettext-macro-timezone-measure 2>/dev/null || \
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            libncurses-dev libssl-dev libelf-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget antlr3 gettext libtool-bin

      - name: Clone ImmortalWrt
        if: steps.tag.outputs.skip != 'true'
        run: |
          git clone -b master --depth 1 "https://github.com/${REPO}.git" openwrt

      - name: Apply customization
        if: steps.tag.outputs.skip != 'true'
        run: |
          cp -a files/. openwrt/files/ 2>/dev/null || { mkdir -p openwrt/files && cp -a files/. openwrt/files/; }
          # 第三方源置顶：feeds 安装先到先得，保证 sbwml/passwall 版本压过官方同名包
          # passwall_packages(依赖库)排尾部：与稳定版同规则，官方同名库随 master golang 兼容
          grep -v 'src-git apkg' openwrt/feeds.conf.default > openwrt/fc.tmp
          cat feeds.conf.extra openwrt/fc.tmp feeds.conf.tail > openwrt/feeds.conf.default
          rm openwrt/fc.tmp
          cp config/imm.config openwrt/dotconfig.seed
          cp scripts/diy2.sh openwrt/diy2.sh
          chmod +x openwrt/diy2.sh

      - name: Update feeds
        if: steps.tag.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          for idx in feeds/*.index; do
            [ -s "$idx" ] || { echo "FATAL: 空索引 $idx（扫描静默失败）"; exit 1; }
          done
          echo "indexes OK"

      - name: Configure
        if: steps.tag.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          cp dotconfig.seed .config
          ./scripts/feeds install -a
          bash diy2.sh
          make defconfig
          echo "==== sanity ===="
          grep -E "^CONFIG_TARGET_ROOTFS_PARTSIZE=|nikki=|mosdns=|passwall=|argon=|KERNEL" .config | head -12
          for p in luci luci-app-nikki mihomo-meta luci-app-mosdns mosdns luci-app-passwall luci-theme-argon luci-app-upnp; do
            grep -qE "^[[:space:]]*config PACKAGE_${p}\$" tmp/.config-package.in || { echo "FATAL: $p 未被构建系统识别（源未装好）"; exit 1; }
            grep -q "^CONFIG_PACKAGE_${p}=y$" .config || {
              echo "FATAL: $p 未选中，依赖情况："
              awk "/^[[:space:]]*config PACKAGE_${p}\$/,/^$/" tmp/.config-package.in | head -8
              exit 1; }
          done
          grep -q "^CONFIG_TARGET_ROOTFS_PARTSIZE=976$" .config || { echo "FATAL: PARTSIZE 丢失"; exit 1; }
          [ -e package/feeds/mosdns/mosdns ] && [ ! -e package/feeds/packages/mosdns ] || { echo "FATAL: mosdns 出处不对(sbwml未胜出或官方重复在链)"; ls package/feeds/*/mosdns 2>/dev/null; exit 1; }
          [ -e package/feeds/passwall_luci/luci-app-passwall ] && [ ! -e package/feeds/luci/luci-app-passwall ] || { echo "FATAL: passwall 出处不对"; ls package/feeds/*/luci-app-passwall 2>/dev/null; exit 1; }
          [ -e package/feeds/nikki/mihomo-meta ] || { echo "FATAL: mihomo-meta 未从 nikki 源安装"; exit 1; }
          [ -e package/feeds/packages/xray-core ] && [ ! -e package/feeds/passwall_packages/xray-core ] || { echo "FATAL: xray-core 未走官方源(go版本兼容)"; ls package/feeds/*/xray-core 2>/dev/null; exit 1; }
          echo "sanity PASS"

      - name: Download packages
        if: steps.tag.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          (make -j$(nproc) download V=w 2>&1 | tail -5) || true
          make download V=w -j1 2>&1 | tail -3 || true

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          make -j$(($(nproc)-1)) V=s > /tmp/build.log 2>&1 || {
            echo "==== parallel build failed, retry serial ===="
            make -j1 V=s > /tmp/build2.log 2>&1 || {
              echo "==== tail of logs ===="; tail -50 /tmp/build.log; tail -50 /tmp/build2.log; exit 1; }
          }
          find bin/targets -name "immortalwrt*x86-64*combined-efi*sysupgrade*" | tee /tmp/artifacts.txt

      - name: Upload artifact (backup)
        if: steps.tag.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ steps.tag.outputs.tag }}
          path: openwrt/bin/targets/*/*/*.img.gz
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmortalWrt-${{ steps.tag.outputs.tag }}
          name: "ImmortalWrt ${{ steps.tag.outputs.tag }} (定制固件 · master 快照)"
          files: openwrt/bin/targets/*/*/*.img.gz
          body: |
            基于 ImmortalWrt master 开发分支快照（内核/软件包为上游最新）。
            追求稳定请选择稳定版 Release（ImmortalWrt v25.12.x），两版自由选择。
            旁路由固件。管理地址 http://192.168.1.2 ，登录 root / password。
            BIOS 虚拟机刷 generic-ext4-combined.img.gz，UEFI 刷 -efi 版。

      - name: Prune old master releases (keep 7)
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.tag_name | startswith("ImmortalWrt-master-")) | .id' \
            | tail -n +8 | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
            done

      - name: NanoMuse TG push
        if: always() && steps.tag.outputs.skip != 'true' && env.NANOMUSE_TG_TOKEN != ''
        env:
          NANOMUSE_TG_TOKEN: ${{ secrets.NANOMUSE_TG_TOKEN }}
          NANOMUSE_CHAT: ${{ secrets.NANOMUSE_CHAT }}
          FW_TAG: ${{ steps.tag.outputs.tag }}
          BUILD_CONCLUSION: ${{ job.status }}
        run: python3 scripts/notify.py
